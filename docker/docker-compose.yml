# OpenWebUI on the Synology DS918+, using OpenRouter as an OpenAI-compatible backend.
# Reachable only on the home LAN and, via the subnet router, by authorized tailnet members.
#
# The project name comes from the folder name (open-webui). Deploy with
# Synology Container Manager (DSM 7.2+, Project) or over SSH:
#   cd /volume1/docker/open-webui && sudo docker-compose up -d   # DSM 7.1 Docker package (Compose v1)
#   cd /volume1/docker/open-webui && sudo docker compose up -d   # Compose v2

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_TAG:-main}
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "${OPEN_WEBUI_PORT:-3000}:8080"
    environment:
      OPENAI_API_BASE_URL: "https://openrouter.ai/api/v1"
      OPENAI_API_KEY: "${OPENROUTER_API_KEY:?OPENROUTER_API_KEY must be set in .env}"
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY must be set in .env}"
      ENABLE_OLLAMA_API: "false"
      ENABLE_SIGNUP: "${ENABLE_SIGNUP:-true}"
    volumes:
      - ./data:/app/backend/data
